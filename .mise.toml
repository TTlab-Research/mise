# mise.toml - Zed Mise Extension development environment
# This file configures the development tools for this Rust extension

[tools]
rust = "stable"

[env]
# Cargo settings for optimization
RUSTFLAGS = "-C target-cpu=native"
CARGO_PROFILE_RELEASE_OPT_LEVEL = "s"
CARGO_PROFILE_RELEASE_LTO = "true"

[tasks.build]
description = "Build the Rust extension"
run = "cargo build"

[tasks.build-release]
description = "Build optimized release binary"
run = "cargo build --release"

[tasks.check]
description = "Check code without building"
run = "cargo check"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"
